<!DOCTYPE html>

<html lang="ta">

<head>

    <meta charset="UTF-8">

    <title>
        தமிழ் ஜோதிடம்
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        தமிழ் ஜாதகம்
    </h1>

    <form
        method="POST"
        action="/chart"
    >

        <label>
            பெயர்
        </label>

        <input
            name="name"
            required
        >

        <label>
            பிறந்த தேதி
        </label>

        <input
            type="date"
            name="date"
            required
        >

        <label>
            பிறந்த நேரம்
        </label>

        <input
            type="time"
            name="time"
            required
        >

        <label>
            Latitude
        </label>

        <input
            type="number"
            step="any"
            name="latitude"
            placeholder="10.7905"
            required
        >

        <label>
            Longitude
        </label>

        <input
            type="number"
            step="any"
            name="longitude"
            placeholder="78.7047"
            required
        >

        <button type="submit">
            ஜாதகம் கணக்கிடுக
        </button>

    </form>

</div>

</body>

</html>
